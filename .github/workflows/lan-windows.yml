name: LAN Windows build

on:
  workflow_dispatch:
  push:
    branches: [lan-only]
    paths:
      - .github/workflows/lan-windows.yml
      - build-lan-windows.ps1
      - src/platform/windows/lan.rs

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      VCPKG_ROOT: ${{ github.workspace }}/build/lan-vcpkg
      VCPKG_DEFAULT_TRIPLET: x64-windows-static
      VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.75.0
          components: rustfmt

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: lan-windows-x86_64
          cache-on-failure: true

      - uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: '15.0'

      - uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: stable
          flutter-version: 3.24.5
          architecture: x64

      - name: Apply the repository's Flutter compatibility patch
        shell: pwsh
        run: |
          $root = Split-Path (Split-Path (Get-Command flutter).Source)
          git -C $root apply "$env:GITHUB_WORKSPACE/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"
          if ($LASTEXITCODE -ne 0) { throw 'Flutter patch failed.' }
          flutter precache --windows
          if ($LASTEXITCODE -ne 0) { throw 'Flutter engine setup failed.' }
          Invoke-WebRequest https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile "$env:RUNNER_TEMP/windows-engine.zip"
          Expand-Archive "$env:RUNNER_TEMP/windows-engine.zip" "$env:RUNNER_TEMP/windows-engine"
          Copy-Item "$env:RUNNER_TEMP/windows-engine/*" "$root/bin/cache/artifacts/engine/windows-x64-release/" -Recurse -Force

      - name: Checkout the pinned vcpkg toolchain
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: microsoft/vcpkg
          ref: 9e593bb18ea69cc5095e012465dcd675a822ed0d
          path: build/lan-vcpkg

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            build/lan-vcpkg/installed
            build/lan-vcpkg/downloads
          key: lan-windows-codecs-9e593bb-${{ hashFiles('res/vcpkg/**') }}

      - name: Build software codecs
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg bootstrap failed.' }
          & "$env:VCPKG_ROOT/vcpkg.exe" install --classic --triplet x64-windows-static --host-triplet x64-windows-static "--overlay-ports=$env:GITHUB_WORKSPACE/res/vcpkg" aom libvpx libyuv opus
          if ($LASTEXITCODE -ne 0) { throw 'Codec installation failed.' }

      - name: Install pinned bridge generators
        shell: pwsh
        run: |
          cargo install cargo-expand --version 1.0.95 --locked
          if ($LASTEXITCODE -ne 0) { throw 'cargo-expand installation failed.' }
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked
          if ($LASTEXITCODE -ne 0) { throw 'Bridge generator installation failed.' }

      - name: Build, test, and package the LAN app
        shell: pwsh
        run: ./build-lan-windows.ps1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdesk-lan-windows-x86_64
          path: |
            build/releases/windows/*.zip
            build/releases/windows/*.sha256
          if-no-files-found: error
